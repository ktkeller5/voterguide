<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Ballot Explainer, Nov 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a ballot-booth workbench. Left rail = the ballot in order; right = one contest at a time, arguments side by side, endorsements as a scannable strip. */
:root{
  --paper:#F4F6F5;
  --surface:#FFFFFF;
  --ink:#15202B;
  --muted:#596572;
  --line:#D6DCE0;
  --accent:#1D5B86;
  --accent-soft:#E3EEF6;
  --yes:#2B7A4B; --yes-soft:#E2F2E8;
  --no:#A93838; --no-soft:#F8E4E4;
  --neutral:#8A6A12; --neutral-soft:#F6EED6;
  --font-display:"Archivo Narrow","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E151D; --surface:#16202B; --ink:#E5EAEE; --muted:#9AA6B2; --line:#2A3846;
    --accent:#76AEDB; --accent-soft:#1B2E40;
    --yes:#6CC596; --yes-soft:#16301F; --no:#F08B8B; --no-soft:#3A1C1C; --neutral:#E0BE62; --neutral-soft:#33290F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E151D; --surface:#16202B; --ink:#E5EAEE; --muted:#9AA6B2; --line:#2A3846;
  --accent:#76AEDB; --accent-soft:#1B2E40;
  --yes:#6CC596; --yes-soft:#16301F; --no:#F08B8B; --no-soft:#3A1C1C; --neutral:#E0BE62; --neutral-soft:#33290F;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.15;margin:0}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px;max-width:1360px;margin:0 auto}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:1.35rem;font-weight:700;letter-spacing:.01em}
.brand span{font-size:.82rem;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tabs a{font-size:.88rem;font-weight:600;text-decoration:none;color:var(--ink);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.tabs a.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.lensbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 20px 12px;max-width:1360px;margin:0 auto}
.lensbar .lbl{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.chip{font:inherit;font-size:.82rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;max-width:1360px;margin:0 auto}
nav.rail{border-right:1px solid var(--line);padding:16px 12px 40px;position:sticky;top:112px;align-self:start;max-height:calc(100vh - 112px);overflow-y:auto}
.rail h4{font-family:var(--font-display);font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 8px 6px}
.rail h4:first-child{margin-top:0}
.rail a{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.9rem}
.rail a:hover{background:var(--accent-soft)}
.rail a.on{background:var(--accent-soft);font-weight:600}
.rail a .code{font-family:var(--font-display);font-weight:700;min-width:2.4em;color:var(--accent)}
.rail a .pick{margin-left:auto;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:4px}
.rail a.dim{opacity:.35}
main{padding:24px 28px 80px;min-width:0}
.mobile-nav{display:none;padding:12px 16px 0}
.mobile-nav select{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.kicker{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.item-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.item-head h2{font-size:2.1rem;font-weight:700}
.item-head .badge{font-family:var(--font-display);font-size:2.6rem;font-weight:700;color:var(--accent);line-height:1}
.short{font-size:1.1rem;max-width:68ch;margin:8px 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.meta span{font-size:.8rem;padding:3px 9px;border-radius:4px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.section{margin:22px 0}
.section > h3{font-size:1.15rem;margin-bottom:10px}
ul.clean{margin:0;padding-left:1.1em}
ul.clean li{margin:4px 0;max-width:70ch}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn div{padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.yn b{display:block;font-family:var(--font-display);font-size:1rem;margin-bottom:2px}
.pro{border-top:4px solid var(--yes)}
.con{border-top:4px solid var(--no)}
.pro h3{color:var(--yes)} .con h3{color:var(--no)}
.lens{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:14px 18px}
.lens dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}
.lens dt{font-weight:700;font-size:.85rem}
.lens dd{margin:0;font-size:.93rem}
.endorse{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.org{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.org .n{font-size:.82rem;font-weight:600}
.org .l{font-size:.72rem;color:var(--muted)}
.pos{font-family:var(--font-display);font-weight:700;font-size:.95rem;padding:1px 8px;border-radius:4px;align-self:flex-start}
.pos.Y{background:var(--yes-soft);color:var(--yes)}
.pos.N{background:var(--no-soft);color:var(--no)}
.pos.O{background:var(--neutral-soft);color:var(--neutral)}
.pos.U{background:var(--paper);color:var(--muted);font-weight:500}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.92rem}
.who p{margin:4px 0 0}
.sources{font-size:.85rem}
.sources a{word-break:break-word}
.ours{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.ours .person{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ours .person b{font-size:.9rem;min-width:6em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;padding:5px 12px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].Y{background:var(--yes);color:var(--surface)}
.seg button[aria-pressed="true"].N{background:var(--no);color:var(--surface)}
.seg button[aria-pressed="true"].O{background:var(--neutral);color:var(--surface)}
.ours select{font:inherit;font-size:.88rem;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cand h3{font-size:1.4rem}
.cand .role{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.cand h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
.cand h4.f{color:var(--yes)} .cand h4.a{color:var(--no)}
.endorsers{font-size:.86rem;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
table.matrix{border-collapse:collapse;font-size:.85rem;min-width:760px;width:100%}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.matrix th,table.matrix td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.matrix th{font-family:var(--font-display);font-size:.85rem;position:sticky;top:0;background:var(--surface)}
table.matrix td.c{text-align:center}
table.matrix tr.grp td{background:var(--paper);font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
table.matrix a{text-decoration:none;font-weight:600}
.prose{max-width:72ch}
.prose p{margin:0 0 12px}
.note{font-size:.88rem;color:var(--muted)}
.btn{font:inherit;font-size:.88rem;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--accent)}
.disagree td{background:var(--neutral-soft)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px}
.pager a{text-decoration:none;font-weight:600;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.names{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.names input{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:11em}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
@media (max-width: 900px){
  .wrap{grid-template-columns:1fr}
  nav.rail{display:none}
  .mobile-nav{display:block}
  main{padding:18px 16px 60px}
  .grid2,.yn,.who{grid-template-columns:1fr}
  .item-head h2{font-size:1.7rem}
  .tabs{margin-left:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>San Francisco Ballot Explainer</h1>
      <span>General election · Tuesday, November 3, 2026 · Arguments for and against, from sources across the spectrum</span>
    </div>
    <div class="tabs" role="navigation" aria-label="Views">
      <a href="#overview" id="tab-overview">Start here</a>
      <a href="#matrix" id="tab-matrix">Endorsement grid</a>
      <a href="#our-ballot" id="tab-our-ballot">Our ballot</a>
    </div>
  </div>
  <div class="lensbar" role="group" aria-label="Filter by priority">
    <span class="lbl">Show what touches</span>
    <button class="chip" data-lens="taxes" aria-pressed="false">Taxes</button>
    <button class="chip" data-lens="safety" aria-pressed="false">Public safety</button>
    <button class="chip" data-lens="downtown" aria-pressed="false">Downtown recovery</button>
    <button class="chip" data-lens="transit" aria-pressed="false">Transit</button>
    <button class="chip" data-lens="home" aria-pressed="false">Homeowners</button>
  </div>
</header>
<div class="mobile-nav"><label for="jump" class="kicker">Jump to</label><select id="jump"></select></div>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="Ballot contents"></nav>
  <main id="main" tabindex="-1"></main>
</div>

{id:"prop-h", group:"San Francisco measures", code:"H", kind:"measure",

       "Seniors 65+ living in their homes can get a reduced or zero tax. Rent-controlled landlords can pass through up to 50% (max $65 per unit per year).",

 yes:"Create the parcel tax for Muni operations.",
 no:"Do not create the tax.",
 pros:["Mayor Lurie told the Chronicle that without it wait times could double and service could be cut by as much as 30%.","Muni is how seniors and many downtown commuters get around; service cuts would hit economic recovery.","95% of homeowners would pay $129 in year one; large commercial owners pay the most. Even the SF Chamber of Commerce, which usually fights taxes, supports it."],
 cons:["Asks owners to fund a ~$300M deficit for 15 years without required cost cuts, efficiency targets or spending review.","A square-footage tax isn't fair to all owners; renters can still get partial pass-throughs.","The SF Republican Party's representative told the Chronicle he has seen no convincing plan for Muni's future."],
 endorse:{growsf:"Y",chron:"Y",spur:"Y",sfdem:"Y",edlee:"Y",league:"Y",sfgop:"N"},
 supporters:"SF Chamber of Commerce, Bay Area Council, SF Democratic Party, SF Labor Council, SF Tenants Union, Firefighters 798, TWU 250A", opponents:"SF Republican Party, Business League",
 lens:{taxes:"New tax on your home: $129/yr for a home up to 3,000 sq ft (more above that), inflation-adjusted, for 15 years.",transit:"Directly funds Muni operations; SFMTA's budget plan counts on it alongside RTM.",downtown:"Supporters frame Muni service as essential for commuters returning downtown.",home:"Applies per parcel to owner-occupied homes; senior homeowners 65+ can get reductions."},
 sources:[S.lwv,["SF Chronicle: Yes on Prop H","https://www.sfchronicle.com/opinion/editorials/article/prop-h-muni-san-francisco-22456325.php"],S.growsf,S.spur,S.league]},

/* ===== Regional ===== */

       "San Francisco's money goes mostly to Muni (~63%, about $144–155M/yr) and BART (~29%), plus Caltrain and a small share for Golden Gate Transit.",

 endorse:{growsf:"Y",chron:"U",spur:"Y",sfdem:"U",edlee:"Y",league:"Y",sfgop:"U"},
 supporters:"Connect Bay Area coalition, Mayor Lurie, state Sen. Scott Wiener (author of enabling law SB 63)", opponents:"Committee for Affordable Bay Area Transit (Gregg Dieguez), which also sued over the ballot language",
 lens:{taxes:"Raises the SF sales tax by 1 percentage point for 14 years.",transit:"Largest single funding source on the ballot for Muni and BART; SFMTA's budget assumes it.",downtown:"Backers say BART/Muni service levels determine how easily commuters reach downtown."},

  {name:"Alida Fisher",party:"",role:"Incumbent commissioner",f:["Parents group says she has consistently put students first."],a:["Not on GrowSF's slate."],e:"SF Parents Action"},
  {name:"Virginia Cheung, Reina Tello, Ryan Hazelton",party:"",role:"Teachers-union slate",f:["Focus on educators, workforce readiness and social integration."],a:["Reform-minded groups favor the other slate on accountability and budget."],e:"United Educators of SF, League of Pissed Off Voters; Green Party (Cheung)"},
  {name:"Laurance Lee",party:"",role:"Candidate",f:[""],a:[""],e:"None found"}],
 lens:{taxes:"The district's budget health affects future school parcel taxes and bonds."},
 sources:[["Mission Local: dueling slates","https://missionlocal.org/2026/09/san-francisco-school-board-race-dueling-slates/"],["GrowSF: Board of Ed","https://growsf.org/voter-guide/san-francisco-voter-guide-november-2026-election/contests/board-of-education/"],S.league,S.edlee]},

 cands:[

  {name:"Leah LaCroix, Bunny McFadden",party:"",role:"Progressive slate",f:["Pitched as protecting City College for future generations."],a:["Fiscal-reform groups prefer the other slate."],e:"League of Pissed Off Voters"},
  {name:"Lisa Wynn II, Rome Moses Jones, Jeremy Lee",party:"",role:"Other candidates",f:[""],a:[""],e:"None found"}],
 lens:{taxes:"City College has relied on local parcel taxes."},
 sources:[S.growsf,["SF Chronicle local endorsements","https://www.sfchronicle.com/opinion/editorials/article/endorsements-san-francisco-election-22490134.php"],S.league]},

{id:"bart", group:"Local offices", code:"BART8", kind:"race", title:"BART Board, District 8",
 short:"Only Sara Barz is listed.", meta:["4-year term"],
 cands:[{name:"Sara Barz",party:"",role:"Transit payments and regional coordination background",f:["GrowSF: her background fits the job, especially if RTM fails."],a:["Unopposed."],e:"GrowSF, Ed Lee Dem Club"}],

 lens:{home:"Sets the assessed value on your home.",taxes:"Property-tax assessments."}, sources:[S.growsf,S.league]},

{id:"pd", group:"Local offices", code:"PD", kind:"race", title:"Public Defender",
 short:"Unopposed.", meta:["4-year term"],
 cands:[{name:"Mano Raju",party:"",role:"Incumbent",f:["Supporters back his defense of indigent clients."],a:["GrowSF gives only a 'weak' endorsement: the office has refused cases and been held in contempt, and could save about $1M by dropping lobbying and political activity. Ed Lee Dem Club made no endorsement."],e:"GrowSF (weak), League of Pissed Off Voters"}],

{id:"judges", group:"Judicial retention", code:"Courts", kind:"race", title:"Supreme Court and Court of Appeal retention",

 cands:[{name:"All listed justices",party:"",role:"Retention elections",f:["Both GrowSF and the League of Pissed Off Voters list or recommend retaining all of them."],a:["No organized campaign against any justice was found in the sources reviewed."],e:"GrowSF, League of Pissed Off Voters"}],
 lens:{}, sources:[S.certList,S.growsf,S.league]}

/* ---------- State ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let names = store.get("sfb-names",["insert name","insert name"]);
let picks = store.get("sfb-picks",{}); // {itemId:[pick0,pick1]}
let lens = null;
const LENS_LABEL = {taxes:"Taxes",safety:"Public safety",downtown:"Downtown recovery",transit:"Transit",home:"Homeowners"};

/* ---------- Helpers ---------- */
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const groups = [...new Set(ITEMS.map(i=>i.group))];
function pickLabel(it,p){ if(!p) return ""; if(it.kind==="measure") return POS[p]||p; return p; }

function renderRail(){
  const rail=document.getElementById("rail"); const sel=document.getElementById("jump");
  let h="", o='<option value="overview">Start here</option><option value="matrix">Endorsement grid</option><option value="our-ballot">Our ballot</option>';
  groups.forEach(g=>{
    h+=`<h4>${esc(g)}</h4>`; o+=`<optgroup label="${esc(g)}">`;
    ITEMS.filter(i=>i.group===g).forEach(i=>{
      const dim = lens && !(i.lens && i.lens[lens]);
      const p = (picks[i.id]||[])[0];
      let pk="";
      if(p && i.kind==="measure") pk=`<span class="pick pos ${p}">${p==="Y"?"Y":p==="N"?"N":"?"}</span>`;
      else if(p) pk=`<span class="pick pos U">✓</span>`;
      h+=`<a href="#${i.id}" data-id="${i.id}" class="${dim?"dim":""}"><span class="code">${esc(i.code)}</span><span>${esc(i.title)}</span>${pk}</a>`;
      o+=`<option value="${i.id}">${esc(i.code)} · ${esc(i.title)}</option>`;
    });
    o+="</optgroup>";
  });
  rail.innerHTML=h; sel.innerHTML=o;
}

function endorseHTML(it){
  const keys = it.st ? ["growsf","spur","edlee","league","chron","sfdem"] : ["growsf","chron","spur","sfdem","edlee","league","sfgop"];
  return `<div class="endorse">${keys.filter(k=>it.st? it.endorse[k]!==undefined : true).map(k=>{
    const v=it.endorse[k]||"U"; return `<div class="org"><span class="n">${ORGS[k].n}</span><span class="l">${ORGS[k].l}</span><span class="pos ${v}">${POS[v]}</span></div>`}).join("")}</div>`;
}
function lensHTML(it){
  const ks=Object.keys(it.lens||{}); if(!ks.length) return "";
  return `<div class="section lens"><h3 style="font-size:1rem;margin-bottom:8px">How it touches your priorities</h3><dl>${ks.map(k=>`<dt>${LENS_LABEL[k]}</dt><dd>${esc(it.lens[k])}</dd>`).join("")}</dl><p class="note" style="margin:10px 0 0">Factual connections only, not a recommendation.</p></div>`;
}
function sourcesHTML(it){
  return `<div class="section sources"><h3 style="font-size:1rem">Sources</h3><ul class="clean">${it.sources.map(s=>`<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ul></div>`;
}
function oursHTML(it){
  const cur=picks[it.id]||["",""];
  if(it.kind==="measure"){
    return `<div class="card section"><div class="kicker" style="margin-bottom:8px">Our call</div><div class="ours">${[0,1].map(n=>`<div class="person"><b>${esc(names[n])}</b><span class="seg" role="group" aria-label="${esc(names[n])}'s vote">${["Y","N","O"].map(v=>`<button class="${v}" data-item="${it.id}" data-person="${n}" data-val="${v}" aria-pressed="${cur[n]===v}">${v==="Y"?"Yes":v==="N"?"No":"Unsure"}</button>`).join("")}</span></div>`).join("")}</div></div>`;
  }
  const opts=it.cands.map(c=>c.name).filter(n=>!/^Others?$|^Other candidates$|^All listed/.test(n));
  return `<div class="card section"><div class="kicker" style="margin-bottom:8px">Our pick</div><div class="ours">${[0,1].map(n=>`<div class="person"><label for="sel-${it.id}-${n}"><b>${esc(names[n])}</b></label><select id="sel-${it.id}-${n}" data-item="${it.id}" data-person="${n}"><option value="">Undecided</option>${opts.map(o=>`<option ${cur[n]===o?"selected":""}>${esc(o)}</option>`).join("")}<option ${cur[n]==="Other / write-in"?"selected":""}>Other / write-in</option><option ${cur[n]==="Skip"?"selected":""}>Skip</option></select></div>`).join("")}</div></div>`;
}
function pager(it){
  const i=ITEMS.indexOf(it), p=ITEMS[i-1], n=ITEMS[i+1];
  return `<div class="pager">${p?`<a href="#${p.id}">← ${esc(p.code)} ${esc(p.title)}</a>`:"<span></span>"}${n?`<a href="#${n.id}">${esc(n.code)} ${esc(n.title)} →</a>`:"<span></span>"}</div>`;
}

function renderMeasure(it){
  return `<div class="kicker">${esc(it.group)}</div>
  <div class="item-head"><h2>${esc(it.title)}</h2><div class="badge">${it.st?"Prop ":"Prop "}${esc(it.code)}</div></div>
  <p class="short">${esc(it.short)}</p>
  <div class="meta">${it.meta.map(m=>`<span>${esc(m)}</span>`).join("")}</div>
  ${oursHTML(it)}
  <div class="section"><h3>What it does</h3><ul class="clean">${it.what.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
  <div class="section yn"><div><b>A Yes vote means</b>${esc(it.yes)}</div><div><b>A No vote means</b>${esc(it.no)}</div></div>
  <div class="section grid2"><div class="card pro"><h3>Arguments for</h3><ul class="clean">${it.pros.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div><div class="card con"><h3>Arguments against</h3><ul class="clean">${it.cons.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div></div>
  ${lensHTML(it)}
  <div class="section"><h3>Who recommends what</h3>${endorseHTML(it)}
  ${(it.supporters||it.opponents)?`<div class="who section"><div><b>Other notable supporters</b><p>${esc(it.supporters||"—")}</p></div><div><b>Other notable opponents</b><p>${esc(it.opponents||"—")}</p></div></div>`:""}
  <p class="note">"Not found" means we couldn't confirm that group's position in published sources by Nov 2.</p></div>
  ${sourcesHTML(it)}${pager(it)}`;
}
function renderRace(it){
  return `<div class="kicker">${esc(it.group)}</div>
  <div class="item-head"><h2>${esc(it.title)}</h2><div class="badge">${esc(it.code)}</div></div>
  <p class="short">${esc(it.short)}</p>
  <div class="meta">${it.meta.map(m=>`<span>${esc(m)}</span>`).join("")}</div>
  ${oursHTML(it)}
  <div class="cands section">${it.cands.map(c=>`<div class="card cand"><h3>${esc(c.name)}</h3><div class="role">${esc([c.party,c.role].filter(Boolean).join(" · "))}</div>
   ${c.f.filter(Boolean).length?`<h4 class="f">What supporters say</h4><ul class="clean">${c.f.filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
   ${c.a.filter(Boolean).length?`<h4 class="a">What critics say</h4><ul class="clean">${c.a.filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
   <div class="endorsers"><b>Endorsed by:</b> ${esc(c.e)}</div></div>`).join("")}</div>
  ${lensHTML(it)}${sourcesHTML(it)}${pager(it)}`;
}

function renderOverview(){
  const shown = lens ? ITEMS.filter(i=>i.lens&&i.lens[lens]) : null;
  return `<div class="prose">
  <div class="kicker">Start here</div><h2 style="font-size:2.2rem;margin:4px 0 14px">What's on a San Francisco ballot on November 3</h2>
  <p>San Francisco voters face <b>11 local measures</b> (Props A–J plus regional Prop RTM), <b>14 state propositions</b>, and a long list of candidate races, from governor to Board of Education. Pick any item on the left. Each page lays out what it does, the strongest arguments on each side, how it connects to the priorities you named (taxes, public safety, downtown recovery, transit, and being homeowners), and who recommends what.</p>
  <p><b>About balance.</b> The arguments come mainly from the League of Women Voters, which is nonpartisan and makes no recommendations, plus the official ballot arguments and news coverage. Endorsements come from groups across the spectrum: GrowSF (moderate, pro-growth), SPUR (urban policy), the Chronicle editorial board, the Ed Lee Democratic Club (moderate), the SF Democratic Party, the League of Pissed Off Voters (progressive), and the SF Republican Party where its positions were published. GrowSF is an advocacy group with its own agenda, so its picks appear alongside the others, not as a neutral source.</p>
  <p><b>Your ballot may differ.</b> Supervisor races appear only in Districts 2, 4, 6, 8 and 10. You'll see either CA-11 or CA-15 for Congress and either Assembly District 17 or 19, depending on your address. Check your sample ballot at <a href="https://sfelections.org" target="_blank" rel="noopener">sfelections.org</a>.</p>
  <p><b>Use it together.</b> Each page has an "Our call" row for both of you. Your choices stay in this browser only, so fill it in on one device. The <a href="#our-ballot">Our ballot</a> tab shows where you agree and disagree and lets you copy the list.</p>
  <div class="names card" style="margin:16px 0"><span class="kicker">Your names</span><label for="n0" class="note">Person 1</label><input id="n0" value="${esc(names[0])}"><label for="n1" class="note">Person 2</label><input id="n1" value="${esc(names[1])}"></div>
  <h3 style="font-size:1.3rem;margin:26px 0 10px">${lens?`Items that touch ${LENS_LABEL[lens].toLowerCase()} (${shown.length})`:"Where your priorities pull in different directions"}</h3>
  ${lens? `<ul class="clean">${shown.map(i=>`<li><a href="#${i.id}"><b>${esc(i.code)}</b> ${esc(i.title)}</a>: ${esc(i.lens[lens])}</li>`).join("")}</ul>`
  : `<ul class="clean">
    <li><b>Taxes vs. transit.</b> <a href="#prop-h">Prop H</a> ($129/yr per typical home) and <a href="#prop-rtm">RTM</a> (+1 point on the SF sales tax) are new taxes and also the main money keeping Muni and BART from deep cuts. SFMTA's budget plan counts on both.</li>
    <li><b>Taxes, the long view.</b> <a href="#prop-43">Prop 43</a> would require two-thirds approval for future local special taxes like H. <a href="#prop-41">41</a> and <a href="#prop-42">42</a> limit new state taxes and would cancel the <a href="#prop-40">billionaire tax</a> if they outpoll it.</li>
    <li><b>Public safety and City Hall.</b> <a href="#prop-f">Prop F</a> moves power over the Police Chief from the Police Commission to the mayor. D, E and F together are Mayor Lurie's charter overhaul.</li>
    <li><b>Downtown.</b> <a href="#prop-j">Prop J</a> taxes lenders who take over large foreclosed buildings; <a href="#prop-i">Prop I</a> redirects high-end transfer-tax revenue to housing.</li>
    <li><b>Homeowners.</b> The <a href="#insurance">Insurance Commissioner</a> race is a clear choice between fixing the private home-insurance market and creating a state-run disaster insurer.</li>
  </ul>`}
  <p class="note" style="margin-top:22px">Compiled November 2, 2026. Figures are from the sources linked on each page; the official voter guides from the city and the Secretary of State are the final word. This page doesn't tell you how to vote.</p>
  </div>`;
}

function renderMatrix(){
  const cols=["growsf","chron","spur","sfdem","edlee","league","sfgop"];
  let rows="";
  groups.filter(g=>/measures?|propositions/i.test(g)).forEach(g=>{
    rows+=`<tr class="grp"><td colspan="${cols.length+2}">${esc(g)}</td></tr>`;
    ITEMS.filter(i=>i.group===g).forEach(i=>{
      const p=(picks[i.id]||[]);
      rows+=`<tr><td><a href="#${i.id}">${esc(i.code)}</a></td><td>${esc(i.title)}</td>${cols.map(c=>{const v=i.endorse[c]; return `<td class="c">${v&&v!=="U"?`<span class="pos ${v}">${v==="O"?"—":POS[v]}</span>`:'<span class="note">·</span>'}</td>`}).join("")}</tr>`;
    });
  });
  return `<div class="kicker">Endorsement grid</div><h2 style="font-size:2rem;margin:4px 0 8px">Who recommends what, at a glance</h2>
  <p class="note prose">"—" means the group took no position; "·" means we couldn't find one. Columns run roughly from moderate/business-friendly on the left to progressive, with the SF Republican Party at the end. Candidate endorsements are on each race's page.</p>
  <div class="tablewrap"><table class="matrix"><thead><tr><th>#</th><th>Measure</th>${cols.map(c=>`<th>${ORGS[c].n}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function ballotText(){
  let t="Our ballot, Nov 3 2026\n";
  groups.forEach(g=>{
    t+=`\n${g}\n`;
    ITEMS.filter(i=>i.group===g).forEach(i=>{
      const p=picks[i.id]||["",""];
      t+=`  ${i.code} ${i.title}: ${names[0]}: ${pickLabel(i,p[0])||"—"} | ${names[1]}: ${pickLabel(i,p[1])||"—"}\n`;
    });
  });
  return t;
}
function renderOurs(){
  let rows="", agree=0, dis=0, open=0;
  groups.forEach(g=>{
    rows+=`<tr class="grp"><td colspan="4">${esc(g)}</td></tr>`;
    ITEMS.filter(i=>i.group===g).forEach(i=>{
      const p=picks[i.id]||["",""];
      const d = p[0]&&p[1]&&p[0]!==p[1];
      if(!p[0]||!p[1]) open++; else if(d) dis++; else agree++;
      const cell=v=> i.kind==="measure"? (v?`<span class="pos ${v}">${POS[v]==="No position"?"Unsure":POS[v]}</span>`:'<span class="note">—</span>') : (v?esc(v):'<span class="note">—</span>');
      rows+=`<tr class="${d?"disagree":""}"><td><a href="#${i.id}">${esc(i.code)}</a></td><td>${esc(i.title)}</td><td>${cell(p[0])}</td><td>${cell(p[1])}</td></tr>`;
    });
  });
  return `<div class="kicker">Our ballot</div><h2 style="font-size:2rem;margin:4px 0 8px">Where the two of you landed</h2>
  <p class="prose">${agree} agreed · <b>${dis} to talk through</b> (highlighted) · ${open} still open. Choices are saved in this browser only.</p>
  <p><button class="btn" id="copy">Copy as text</button> <button class="btn ghost" id="clear">Clear all choices</button> <span id="copymsg" class="note" role="status"></span></p>
  <div class="tablewrap"><table class="matrix"><thead><tr><th>#</th><th>Item</th><th>${esc(names[0])}</th><th>${esc(names[1])}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- Router ---------- */
function route(){
  const id=(location.hash||"#overview").slice(1);
  const main=document.getElementById("main");
  const it=ITEMS.find(i=>i.id===id);
  if(it) main.innerHTML = it.kind==="measure"? renderMeasure(it): renderRace(it);
  else if(id==="matrix") main.innerHTML=renderMatrix();
  else if(id==="our-ballot") main.innerHTML=renderOurs();
  else main.innerHTML=renderOverview();
  document.querySelectorAll(".rail a").forEach(a=>a.classList.toggle("on",a.dataset.id===id));
  ["overview","matrix","our-ballot"].forEach(t=>document.getElementById("tab-"+t).classList.toggle("on", t===id || (t==="overview" && !it && id!=="matrix" && id!=="our-ballot")));
  const sel=document.getElementById("jump"); if(sel) sel.value = it||id==="matrix"||id==="our-ballot"? id : "overview";
  window.scrollTo(0,0);
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest(".seg button");
  if(b){ const {item,person,val}=b.dataset; const cur=picks[item]||["",""]; cur[+person]= cur[+person]===val?"":val; picks[item]=cur; store.set("sfb-picks",picks); route(); renderRail(); markRail(); return; }
  const c=e.target.closest(".chip");
  if(c){ const l=c.dataset.lens; lens = lens===l?null:l; document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x.dataset.lens===lens)); renderRail(); markRail(); if(!ITEMS.find(i=>i.id===(location.hash||"").slice(1))) route(); return; }
  if(e.target.id==="copy"){ const msg=document.getElementById("copymsg"); navigator.clipboard.writeText(ballotText()).then(()=>msg.textContent="Copied.").catch(()=>msg.textContent="Copy was blocked by the browser; select the table and copy it instead."); return; }
  if(e.target.id==="clear"){ const btn=e.target; if(btn.dataset.armed){ picks={}; store.set("sfb-picks",picks); route(); renderRail(); } else { btn.dataset.armed="1"; btn.textContent="Click again to clear everything"; } }
});
document.addEventListener("change",e=>{
  const s=e.target;
  if(s.matches("select[data-item]")){ const cur=picks[s.dataset.item]||["",""]; cur[+s.dataset.person]=s.value; picks[s.dataset.item]=cur; store.set("sfb-picks",picks); renderRail(); markRail(); }
  if(s.id==="jump"){ location.hash=s.value; }
});
document.addEventListener("input",e=>{
  if(e.target.id==="n0"||e.target.id==="n1"){ names[e.target.id==="n0"?0:1]=e.target.value||("Person "+(e.target.id==="n0"?1:2)); store.set("sfb-names",names); }
});
function markRail(){ const id=(location.hash||"").slice(1); document.querySelectorAll(".rail a").forEach(a=>a.classList.toggle("on",a.dataset.id===id)); }
window.addEventListener("hashchange",route);
renderRail(); route();
</script>
</body>
</html>
